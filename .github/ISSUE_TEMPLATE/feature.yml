name: Feature
description: Plan an OpsFlow capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a ..., I need ..., so that ...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Business reason
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
  - type: textarea
    id: tests
    attributes:
      label: Testing requirements
    validations:
      required: true
